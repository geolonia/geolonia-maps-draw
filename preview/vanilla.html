<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Engine - Vanilla JS Demo</title>
  <script src="https://cdn.geolonia.com/v1/embed?geolonia-api-key=YOUR-API-KEY"></script>
  <style>
    body { margin: 0; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map" class="geolonia" data-style="geolonia/basic-v1"></div>
  <script type="module">
    import { DrawingEngine } from '@geolonia/drawing-engine/vanilla'
    import '@geolonia/drawing-engine/style.css'

    const mapEl = document.getElementById('map')
    if (!mapEl) throw new Error('#map not found')
    const map = new window.geolonia.Map({ container: mapEl, boxZoom: false })
    map.on('load', () => {
      const engine = new DrawingEngine(map, { showControls: true, appearance: 'light' })

      // 外観切り替え（プレビュー専用）
      const switcher = document.createElement('div')
      switcher.style.cssText = 'position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:4px;padding:6px 8px;border:1px solid #d6d9de;border-radius:10px;background:#fff;font:13px "Noto Sans JP",sans-serif'
      for (const value of ['light', 'dark', 'glass', 'auto']) {
        const btn = document.createElement('button')
        btn.textContent = value
        btn.style.cssText = 'padding:4px 8px;border:1px solid #d6d9de;border-radius:6px;background:#fff;cursor:pointer;font:inherit'
        btn.addEventListener('click', () => engine.setAppearance(value))
        switcher.appendChild(btn)
      }
      document.body.appendChild(switcher)
      engine.addEventListener('change', () => {
        console.log('Features:', JSON.stringify(engine.features, null, 2))
      })

      // Expose for debugging
      window.__engine = engine
    })
  </script>
</body>
</html>
